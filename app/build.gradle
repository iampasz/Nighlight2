plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

apply plugin: 'com.android.application'



android {
    compileSdk 34


    //noinspection GradleCompatible
    defaultConfig {
        applicationId "com.sarnavsky.pasz.nighlight2"
        minSdkVersion 21
        targetSdkVersion 34
        multiDexEnabled true
        versionCode 52
        versionName "6.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            multiDexKeepFile file('multidex-config.txt')


        }
    }

    buildFeatures {
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildToolsVersion "30.0.3"

    namespace 'com.sarnavsky.pasz.nighlight2'
}

repositories {
    maven {
        url 'https://maven.fabric.io/public'
    }
//    maven {
//        name "Chartboost Mediation’s maven repo"
//        url "https://cboost.jfrog.io/artifactory/chartboost-mediation"
//    }

    maven {
        url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea'
    }
    maven {
        url 'https://sdk.tapjoy.com/'
    }
    maven {
        url 'https://artifactory.yahooinc.com/artifactory/maven/'
    }

}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //noinspection GradleCompatible

    implementation "androidx.multidex:multidex:2.0.1"
