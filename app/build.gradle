plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'
    //id 'org.jetbrains.kotlin.android'
//    id 'org.jetbrains.kotlin.kapt'
    id 'kotlin-kapt'
}

apply plugin: 'com.android.application'

apply(plugin: "com.android.application")
apply(plugin: "kotlin-android")


android {

    kotlinOptions {
        jvmTarget = "17"
    }

    compileSdkVersion(34)
    //noinspection GradleCompatible
    defaultConfig {
        applicationId "com.sarnavsky.pasz.nighlight2"
        minSdkVersion 21
        targetSdkVersion 34
        multiDexEnabled true
        versionCode 52
        versionName "6.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {

        release {
            minifyEnabled = true
            shrinkResources = true

            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            multiDexKeepFile file('multidex-config.txt')
        }
        debug {
            debuggable = true
        }

    }

    buildFeatures {
        viewBinding = true
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildToolsVersion "30.0.3"

    namespace 'com.sarnavsky.pasz.nighlight2'

//    kapt {
//        generateStubs = true
//    }

//    kotlinOptions {
//        jvmTarget = '17'
//    }
}


repositories {
    maven {
        url 'https://maven.fabric.io/public'
    }
//    maven {
//        name "Chartboost Mediation’s maven repo"
//        url "https://cboost.jfrog.io/artifactory/chartboost-mediation"
//    }

    maven {
        url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea'
    }
    maven {
        url 'https://sdk.tapjoy.com/'
    }
    maven {
        url 'https://artifactory.yahooinc.com/artifactory/maven/'
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //noinspection GradleCompatible

    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.firebase:firebase-analytics:21.6.1'
    implementation platform('com.google.firebase:firebase-bom:32.1.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-database-ktx:20.3.1'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.firebase:firebase-crashlytics:18.6.3'
    implementation 'com.google.firebase:firebase-crashlytics-ktx:18.6.3'
    implementation 'com.google.firebase:firebase-analytics-ktx:21.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

//    implementation 'com.facebook.android:facebook-android-sdk:5.15.3'
    //  implementation 'com.nightonke:boommenu:2.1.1'
    implementation 'com.daimajia.easing:library:2.4@aar'
    implementation 'com.daimajia.androidanimations:library:2.4@aar'

    implementation 'com.google.android.gms:play-services-ads:23.0.0'

    implementation 'fr.nicolaspomepuy:discreetapprate:2.0.4@aar'


    implementation 'com.google.android.ump:user-messaging-platform:2.2.0'

    implementation 'com.jakewharton:butterknife:10.2.3'

    implementation 'com.jaredrummler:colorpicker:1.1.0'


    implementation 'com.applovin:applovin-sdk:11.10.1'

    implementation 'com.google.ads.mediation:facebook:6.16.0.0'

    implementation 'com.adcolony:sdk:4.8.0'


    //  implementation 'com.chartboost:chartboost-mediation-sdk:4.3.0'

    implementation "org.greenrobot:eventbus:3.3.1"

    implementation 'com.google.android.gms:play-services-base:18.3.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-appset:16.0.2'


//My ADMOB MEDIATION

    implementation 'com.google.ads.mediation:adcolony:4.8.0.2'
    implementation 'com.google.ads.mediation:applovin:12.3.0.0'
    // implementation  'com.google.ads.mediation:chartboost:9.3.1.0'
    //   implementation  'com.google.ads.mediation:ironsource:7.3.1.1'
    // implementation  'com.google.ads.mediation:fyber:8.2.3.0'
    // implementation  'com.google.ads.mediation:inmobi:10.5.5.0'
    // implementation  'com.google.ads.mediation:facebook:6.14.0.0'
    //  implementation  'com.google.ads.mediation:mintegral:16.4.61.0'
    // implementation  'com.google.ads.mediation:tapjoy:13.0.1.0'

    implementation 'com.unity3d.ads:unity-ads:4.7.1'
